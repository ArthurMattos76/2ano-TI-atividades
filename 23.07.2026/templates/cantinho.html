<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
        <body>
            <h1>Login</h1>
            {% if message %}
                <p style="color: red;">{{ message }}</p>
            {% endif %}
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <p style="color: purple;">{{ msg }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="post">
                <label>Usuário: <input type="text" name="username"></label><br>
                <label>Senha: <input type="password" name="password"></label><br>
                <button type="submit">Entrar</button>
            </form>
        </body>
        </html>
