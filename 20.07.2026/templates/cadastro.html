<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
</head>
<body>

<h1>Cadastrar Livro</h1>

{% if erro %}
<p style="color:red;">{{ erro }}</p>
{% endif %}

<form method="POST">

Título:
<input type="text" name="titulo"><br><br>

Autor:
<input type="text" name="autor"><br><br>

Ano:
<input type="text" name="ano"><br><br>

Categoria:
<input type="text" name="categoria"><br><br>

Quantidade:
<input type="number" name="quantidade"><br><br>

<button>Cadastrar Livro</button>

</form>

<br>

<a href="{{ url_for('livros') }}">Listar Livros</a><br>
<a href="{{ url_for('buscar') }}">Buscar Livro</a>

</body>
</html>
