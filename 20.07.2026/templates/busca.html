<!DOCTYPE html>
<html>
<head>
    <title>Buscar</title>
</head>
<body>

<h1>Buscar Livro</h1>

<form method="POST">

Título:

<input type="text" name="titulo">

<button>Buscar</button>

</form>

{% if resultado %}

<h2>Livro Encontrado</h2>

Título: resultado.titulo <br>
Autor: resultado.autor <br>
Ano:  resultado.ano <br>
Categoria:  resultado.categoria <br>
Quantidade:  resultado.quantidade 

{% endif %}

{% if mensagem %}

<p>{{ mensagem }}</p>

{% endif %}


<br>

<a href="{{ url_for('cadastro') }}">
    <button>Voltar</button>
</a>
</body>
</html>
