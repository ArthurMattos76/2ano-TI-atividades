<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências do usuário</title>
</head>
<body class="{{ tema }}">
    <h1> Projeto Flask com Cookies</h1>
    
    {% if nome %}
        <h2> Olá, {{ nome }}! Seja bem de volta.</h2>
    {% else %}
        <h2> Olá, visitante! Seja bem-vindo.</h2>
    {% endif %}

    <form action="/salvar_nomes" method="post">
        <label for="nome">Digite seu nome:</label>
        <input type="text" id="nome" name="nome" required>
        <button type="submit">Salvar Nome</button>
    </form>


    <br>

    <a href="/trocar_tema">
        <button>Alterar Tema</button>
    </a>
    
</body>
</html>
