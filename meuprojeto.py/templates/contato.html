{% extends "base.html" %}

{% block conteudo %}
<h1>Contato</h1>
<p>Preencha o formulário abaixo para entrar em contato conosco. Responderemos o mais breve possível.</p>
<form action="/enviar_contato" method="post">
    <label for="nome">Nome completo:</label>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999"><br><br>

    <label for="assunto">Assunto:</label>
    <select id="assunto" name="assunto" required>
        <option value="">Selecione</option>
        <option value="duvida">Dúvida</option>
        <option value="sugestao">Sugestão</option>
        <option value="reclamacao">Reclamação</option>
        <option value="outro">Outro</option>
    </select><br><br>

    <label for="mensagem">Mensagem:</label><br>
    <textarea id="mensagem" name="mensagem" rows="7" cols="50" required></textarea><br><br>

    <label>
        <input type="checkbox" name="novidades" value="sim">
        Desejo receber novidades por email
    </label><br><br>

    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>
</form>
<p>Se preferir, entre em contato pelo telefone (11) 1234-5678 ou pelo email contato@exemplo.com.</p>
{% endblock %}
